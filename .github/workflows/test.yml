name: "AgriTrust-Protocol Tests"
on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Run builds and tests
      run: |
        cargo generate-lockfile
        cargo update -p arbitrary --precise 1.3.2
        cargo update -p derive_arbitrary --precise 1.3.2
        cargo update -p ed25519-dalek@3.0.0
        make build
        make test

  node-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run JavaScript tests
      run: npm test
